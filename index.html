<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Cargo System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<header class="site-header">
    <h1>Solar Cargo System</h1>
    <p>Konteineru pārvaldības demonstrācijas lapa</p>
</header>

<nav class="site-nav">
    <a href="index.html">Sākums</a>
    <a href="#saraksts">Konteineru saraksts</a>
    <a href="#pievienot">Pievienot konteineru</a>
</nav>

<main class="layout">

<section class="card" id="saraksts">
    <h2>Konteineru saraksts</h2>

    <iframe
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQcTsXDT07MISD8mk4qVobdI0rKMkBZZRZvpIJ5NUCmWI8ya4Mouqwas0VujCUHywp2v7ZahURoeld9/pubhtml?widget=true&headers=false"
        width="100%"
        height="400">
    </iframe>
</section>


<section class="card" id="pievienot">
    <h2>Pievienot konteineru</h2>

    <form class="cargo-form">
        <div class="form-group">
            <label for="container-id">Konteinera ID</label>
            <input type="text" id="container-id" name="container_id">
        </div>

        <div class="form-group">
            <label for="container-name">Nosaukums</label>
            <input type="text" id="container-name" name="container_name">
        </div>

        <div class="form-group">
            <label for="weight">Svars (kg)</label>
            <input type="number" id="weight" name="weight">
        </div>

        <div class="form-group">
            <label for="status">Statuss</label>
            <select id="status" name="status">
                <option>Ceļā</option>
                <option>Noliktavā</option>
                <option>Piegādāts</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Piezīmes</label>
            <textarea id="notes" name="notes" rows="4"></textarea>
        </div>

        <button type="submit">Saglabāt</button>
    </form>
</section>

</main>

<footer class="site-footer">
    <p>&copy; 2026 Solar Cargo</p>
</footer>

</div>

</body>
</html>
