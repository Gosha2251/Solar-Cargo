<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Solar Cargo - Pievienot konteineru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Pievienot konteineru</h1>

<nav>
    <a href="index.html">Sākums</a>
    <a href="konteineri.html">Konteineri</a>
    <a href="statistika.html">Statistika</a>
    <a href="add-container.html">Pievienot konteineru</a>
</nav>

<p>Aizpildi formu, lai reģistrētu jaunu konteineru Solar Cargo sistēmā.</p>

<form action="#" method="post" class="cargo-form">

<div class="form-group">
    <label for="container-id">ID</label>
    <input type="text" id="container-id" name="container_id" required>
</div>

<div class="form-group">
    <label for="mineral">Minerāls</label>
    <input type="text" id="mineral" name="mineral" required>
</div>

<div class="form-group">
    <label for="origin-base">Izcelšanās bāze</label>
    <input type="text" id="origin-base" name="origin_base" required>
</div>

<div class="form-group">
    <label for="destination-base">Galamērķa bāze</label>
    <input type="text" id="destination-base" name="destination_base" required>
</div>

<div class="form-group">
    <label for="status">Statuss</label>
    <select id="status" name="status" required>
        <option value="">-- Izvēlies statusu --</option>
        <option value="cela">Ceļā</option>
        <option value="noliktava">Noliktavā</option>
        <option value="piegadats">Piegādāts</option>
    </select>
</div>

<div class="form-group">
    <label for="notes">Piezīmes</label>
    <textarea id="notes" name="notes" rows="4"></textarea>
</div>

<button type="submit">Saglabāt</button>

</form>

</body>
</html>
